name: Python on Ubuntu

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '43 6 * * 1'

jobs:
  ubuntu_builtin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: ["ubuntu:22.04", "ubuntu:24.04"]
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update && \
          apt-get install -y --no-install-recommends \
            build-essential \
            libffi-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-setuptools \
            automake \
            autoconf \
            libtool
      - name: Build
        run: |
          python3 -m venv .venv-ci
          BUILD_LIB=1 .venv-ci/bin/python -m pip install . pytest
      - name: Test
        run: .venv-ci/bin/python -m pytest

  ubuntu_system:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: ["ubuntu:22.04", "ubuntu:24.04"]
    container:
      image: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update && \
          apt-get install -y --no-install-recommends \
            build-essential \
            libffi-dev \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-setuptools \
            libfuzzy-dev
      - name: Build
        run: |
          python3 -m venv .venv-ci
          BUILD_LIB=0 .venv-ci/bin/python -m pip install . pytest
      - name: Test
        run: .venv-ci/bin/python -m pytest
